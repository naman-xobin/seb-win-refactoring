name: "CodeQL"

on:
  push:
    branches: [ "xolock-refactoring", "master" ]
  pull_request:
    branches: [ "xolock-refactoring", "master" ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: "windows-latest"
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp
        queries: security-extended,security-and-quality

    - name: Set up MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Set up NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore packages
      run: nuget restore SafeExamBrowser.sln -NonInteractive
      shell: pwsh

    - name: Build application projects
      run: |
        $projects = @(
          "SafeExamBrowser.Browser\SafeExamBrowser.Browser.csproj",
          "SafeExamBrowser.Runtime\SafeExamBrowser.Runtime.csproj",
          "SafeExamBrowser.Client\SafeExamBrowser.Client.csproj",
          "SebWindowsConfig\SebWindowsConfig.csproj",
          "SafeExamBrowser.ResetUtility\SafeExamBrowser.ResetUtility.csproj",
          "SafeExamBrowser.Service\SafeExamBrowser.Service.csproj"
        )

        foreach ($project in $projects) {
          msbuild $project /m /p:Configuration=Release /p:Platform=x64 /p:SignOutput=false
        }
      shell: pwsh

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
